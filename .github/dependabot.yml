version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: dev # for PRs
    schedule:
      interval: weekly
    groups:
      static-analysis:
        patterns:
          - "com.google.errorprone:*"
          - "com.uber.nullaway:*"

  - package-ecosystem: github-actions
    directories: [ "/", "/.github/actions/*" ]
    target-branch: dev # for PRs
    schedule:
      interval: weekly