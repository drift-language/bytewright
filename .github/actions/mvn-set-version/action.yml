name: "Maven: versions:set"
author: "Jonathan (GitHub: belicfr)"
description: Set a new version into the pom.xml file

inputs:
  tag-name:
    required: true
    description: Tag's name, must follow the "v*" pattern.

runs:
  using: composite

  steps:
    - run: ./mvnw versions:set -DnewVersion="${NEW_VERSION#v}" -DgenerateBackupPoms=false -B -ntp
      name: "Maven: versions:set"
      shell: bash
      env:
        NEW_VERSION: ${{inputs.tag-name}}