name: Release

on:
  push:
    tags: [ "v*" ] # only tags that use the "v*" pattern

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: false # if a release is in progress, we shouldn't cancel it

permissions:
  contents: read

env:
  FLOOR_JDK: '26'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{env.FLOOR_JDK}}
          cache: maven
          mvn-server-credentials: central:CENTRAL_USERNAME:CENTRAL_TOKEN
          gpg-private-key: ${{secrets.GPG_PRIVATE_KEY}}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - uses: ./.github/actions/mvn-set-version
        with:
          tag-name: ${{github.ref_name}} # tag's name

      - run: ./mvnw deploy -B -ntp -Pci,release
        name: "Maven: deploy"
        env:
          CENTRAL_USERNAME: ${{secrets.CENTRAL_USERNAME}}
          CENTRAL_TOKEN: ${{secrets.CENTRAL_TOKEN}}
          MAVEN_GPG_PASSPHRASE: ${{secrets.GPG_PASSPHRASE}}
